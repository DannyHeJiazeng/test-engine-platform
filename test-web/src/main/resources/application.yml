server:
  port: 8080

spring:
  application:
    name: test-engine-platform
  main:
    allow-bean-definition-overriding: true

  datasource:
    url: ${TEST_ENGINE_DB_URL:jdbc:h2:file:./data/test-engine}
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: false

  h2:
    console:
      enabled: true
      path: /h2-console

# Test Engine Configuration
test-engine:
  workspace: ./test-workspace
  output-dir: ./test-results

  git:
    default-branch: main
    clone-timeout: 300

  maven:
    home: ${env.MAVEN_HOME:}
    build-timeout: 600

  quality-gate:
    min-pass-rate: 0.8
    require-p0-pass: true
    max-failures: 0

  alert:
    dingtalk:
      enabled: false
      webhook-url:
      secret:
    wecom:
      enabled: false
      webhook-url:
    email:
      enabled: false
      smtp-host:
      smtp-port: 587
      username:
      password:
      receivers:

logging:
  level:
    root: INFO
    com.test: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
# Browser sessions expire after 30 minutes of inactivity.
---
server:
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: lax
        secure: ${TEST_ENGINE_COOKIE_SECURE:false}
test-engine:
  auth:
    username: ${TEST_ENGINE_ADMIN_USERNAME:admin}
    password-hash: ${TEST_ENGINE_ADMIN_PASSWORD_HASH:$2y$12$l/VAzhb7MNMPTt4KUQB6/Odyz.UItiEoTF8luC9WjCwTyQigArrqm}
