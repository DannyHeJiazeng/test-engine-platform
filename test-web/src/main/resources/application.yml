server:
  port: 8080

spring:
  application:
    name: test-engine-platform
  main:
    allow-bean-definition-overriding: true

  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: false

  h2:
    console:
      enabled: true
      path: /h2-console

# Test Engine Configuration
test-engine:
  workspace: ./test-workspace
  output-dir: ./test-results

  git:
    default-branch: main
    clone-timeout: 300

  maven:
    home: ${env.MAVEN_HOME:}
    build-timeout: 600

  quality-gate:
    min-pass-rate: 0.8
    require-p0-pass: true
    max-failures: 0

  alert:
    dingtalk:
      enabled: false
      webhook-url:
      secret:
    wecom:
      enabled: false
      webhook-url:
    email:
      enabled: false
      smtp-host:
      smtp-port: 587
      username:
      password:
      receivers:

logging:
  level:
    root: INFO
    com.test: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"